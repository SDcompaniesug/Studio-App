name: Build Studio App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "StudioApp-source.zip"
      - ".github/workflows/build-studio-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Extract Android source
        run: |
          test -f StudioApp-source.zip || { echo "Upload StudioApp_neon_github_updates.zip as StudioApp-source.zip in the repository root."; exit 1; }
          mkdir -p android-src
          unzip -q StudioApp-source.zip -d android-src
      - name: Build debug APK
        working-directory: android-src
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: studio-app-debug
          path: android-src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
